name: Build & Publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          # On workflow_dispatch, always build
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-upload:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS dmg + zip (arm64)
        run: npx electron-builder --mac dmg zip --arm64

      - name: Upload to server
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          # SSH must target the ORIGIN. VM_HOST is the public hostname, which now sits
          # behind a CDN that does not proxy port 22, so ssh/ssh-keyscan against it cannot
          # connect at all. VM_SSH_HOST holds the origin address; it falls back to VM_HOST
          # for a setup with no CDN in front.
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REMOTE_DIR: ${{ secrets.VM_REMOTE_DIR }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          SSH_TARGET_HOST="${VM_SSH_HOST:-$VM_HOST}"

          # Fail loudly on missing configuration instead of surfacing a confusing
          # connection error several commands later.
          missing=""
          [ -z "$VM_SSH_KEY" ]       && missing="$missing VM_SSH_KEY"
          [ -z "$SSH_TARGET_HOST" ]  && missing="$missing VM_SSH_HOST/VM_HOST"
          [ -z "$VM_USER" ]          && missing="$missing VM_USER"
          [ -z "$REMOTE_DIR" ]       && missing="$missing VM_REMOTE_DIR"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          # Deliberately no ssh-keyscan. It previously ran as
          #   ssh-keyscan -H "$VM_HOST" >> known_hosts 2>/dev/null
          # under `bash -e`. Once the hostname moved behind the CDN, keyscan could not reach
          # port 22, exited non-zero, and killed this step instantly with ZERO output and no
          # packet ever reaching the server. The publish was silently broken for three
          # months and presented as a 5-second mystery failure. accept-new records the key
          # on first use and still refuses a CHANGED key, which is all the keyscan bought.
          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=accept-new
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
          )
          REMOTE="$VM_USER@$SSH_TARGET_HOST"

          echo "Connecting to origin as $VM_USER ..."
          ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p '$REMOTE_DIR' && echo '  connected'"

          # Order matters: binaries FIRST, manifest LAST.
          # latest-mac.yml is what advertises a new version to running clients, so if it
          # lands before the zip it names, any client checking in during the upload window
          # tries to download a file that does not exist yet.
          echo "Uploading binaries ..."
          scp "${SSH_OPTS[@]}" dist/*.zip          "$REMOTE:$REMOTE_DIR/"
          scp "${SSH_OPTS[@]}" dist/*.zip.blockmap "$REMOTE:$REMOTE_DIR/"

          # The dmg goes up under BOTH names.
          #
          # latest-mac.yml lists the dmg under its VERSIONED name, so uploading only to the
          # stable name left the manifest advertising a URL that 404'd. The versioned copy
          # is also immutable, which means the CDN can never serve a stale one — the stable
          # link had been serving an April build for three months because its URL never
          # changes and the edge cache has a 4h TTL.
          DMG="$(find dist -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -n "$DMG" ]; then
            scp "${SSH_OPTS[@]}" "$DMG" "$REMOTE:$REMOTE_DIR/"
            # Stable convenience URL for the install page / setup script.
            ssh "${SSH_OPTS[@]}" "$REMOTE" \
              "cp -f '$REMOTE_DIR/$(basename "$DMG")' '$REMOTE_DIR/claude-tray-notifier.dmg'"
          else
            echo "::warning::No .dmg in dist/ — fresh installs would keep serving the previous image."
          fi

          # Manifest last, written to a temp name then moved, so no client can read a
          # half-transferred manifest.
          echo "Publishing manifest ..."
          scp "${SSH_OPTS[@]}" dist/latest-mac.yml "$REMOTE:$REMOTE_DIR/.latest-mac.yml.tmp"
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "mv '$REMOTE_DIR/.latest-mac.yml.tmp' '$REMOTE_DIR/latest-mac.yml'"

          # Retention. Every release adds ~110MB and nothing ever removed the old ones, so
          # this directory reached 2.1GB across 19 stale versions on a disk at 81% use.
          # Only versioned *-mac.zip (+ .blockmap) are considered; the manifest and the dmg
          # are never touched.
          echo "Pruning old releases, keeping the 5 newest ..."
          ssh "${SSH_OPTS[@]}" "$REMOTE" "
            set -eu
            cd '$REMOTE_DIR' || exit 0
            ls -1t *-mac.zip 2>/dev/null | tail -n +6 | while IFS= read -r old; do
              echo \"  removing \$old\"
              rm -f -- \"\$old\" \"\$old.blockmap\"
            done
            echo \"  remaining: \$(ls -1 *-mac.zip 2>/dev/null | wc -l) zip(s), \$(du -sh . | cut -f1) total\"
          "

          echo "Upload of v$VERSION finished."

      # Invalidate the edge cache for the mutable URLs.
      #
      # Versioned artifact URLs are immutable, so a normal release (new version => new
      # filename) is inherently cache-safe. Two cases are not:
      #   - latest-mac.yml never changes name, so a client can read a stale manifest for as
      #     long as the edge TTL (observed: max-age=14400, i.e. 4h) and not notice a release.
      #   - re-publishing the SAME version overwrites a filename the edge already has. The
      #     manifest then advertises a hash the CDN does not serve, and electron-updater
      #     correctly refuses to install. Observed exactly this after republishing 1.9.0.
      #
      # Optional: needs a Cloudflare token with the Cache Purge permission. Skipped with a
      # warning if the secrets are absent, since a normal version-bumped release does not
      # depend on it.
      - name: Purge CDN cache for mutable URLs
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PUBLIC_DOWNLOAD_URL: ${{ secrets.PUBLIC_DOWNLOAD_URL }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_DOWNLOAD_URL:-}" ]; then
            echo "::warning::PUBLIC_DOWNLOAD_URL unset — skipping CDN purge."
            exit 0
          fi
          BASE="${PUBLIC_DOWNLOAD_URL%/}"
          PAYLOAD="$(python3 - "$BASE" "$VERSION" <<'PY'
          import json, sys
          base, version = sys.argv[1], sys.argv[2]
          stem = f"claude-tray-notifier-{version}-arm64-mac"
          files = [
              f"{base}/latest-mac.yml",
              f"{base}/claude-tray-notifier.dmg",
              f"{base}/{stem}.zip",
              f"{base}/{stem}.zip.blockmap",
              f"{base}/{stem}.dmg",
          ]
          print(json.dumps({"files": files}))
          PY
          )"
          RESP="$(curl -s --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")"
          if printf '%s' "$RESP" | grep -q '"success":true'; then
            echo "Edge cache purged for the release URLs."
          else
            # Not fatal: a version-bumped release is cache-cold anyway, and the verification
            # step below is the real gate. A purge token lacking the Cache Purge permission
            # returns code 10000 here.
            echo "::warning::CDN purge failed (a token needs the Cache Purge permission): $RESP"
          fi

      # The old workflow just echoed "Uploaded v<x>" and passed. That is a claim, not a
      # check: the manifest could be stale, cached, or served from the wrong directory and
      # the job would still be green. This asserts the published version over HTTPS.
      - name: Verify the published manifest
        env:
          PUBLIC_DOWNLOAD_URL: ${{ secrets.PUBLIC_DOWNLOAD_URL }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${PUBLIC_DOWNLOAD_URL:-}" ]; then
            echo "::warning::PUBLIC_DOWNLOAD_URL is not set — cannot verify the release is actually reachable. Set it to the public downloads URL to enable this check."
            exit 0
          fi

          BASE="${PUBLIC_DOWNLOAD_URL%/}"

          # The site is behind a CDN with an edge cache, so an unbusted request can return
          # the PREVIOUS manifest and make a good deploy look broken (or vice versa).
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsSL --max-time 30 \
                      -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                      "$BASE/latest-mac.yml?cachebust=$GITHUB_RUN_ID-$attempt" || true)"
            PUBLISHED="$(printf '%s\n' "$BODY" | awk '/^version:/{print $2; exit}')"
            echo "attempt $attempt: published version = '${PUBLISHED:-<none>}' (want '$VERSION')"
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "Manifest verified at $BASE/latest-mac.yml"

              # Confirm the zip the manifest points at is actually downloadable, since a
              # manifest advertising a missing file is the failure the ordering fix targets.
              # Check EVERY artifact the manifest advertises, not just the zip. Verifying
              # only the zip is how a manifest that advertised a 404'ing dmg shipped: the
              # updater uses the zip, so nothing complained, and the dmg link was dead.
              ARTIFACTS="$(printf '%s\n' "$BODY" \
                | awk -F'url: ' '/^[[:space:]]*-?[[:space:]]*url: /{print $2}' | tr -d '\r')"
              if [ -z "$ARTIFACTS" ]; then
                echo "::error::Could not parse any artifact url out of the manifest."
                exit 1
              fi

              # Process substitution, not a pipe: a piped while-loop runs in a subshell and
              # FAILED would not survive it. Not a heredoc either — a heredoc terminator
              # inside a YAML block scalar is needlessly fragile.
              FAILED=0
              while IFS= read -r ART; do
                [ -n "$ART" ] || continue
                ENC="$(printf '%s' "$ART" | sed 's/ /%20/g')"
                # -L matters: the origin 301-redirects any URL containing capitals to a
                # lowercased path. That silently turned a "published" release into an
                # undownloadable one — the redirect looks like a 301 success unless you
                # follow it to the 404. Asserting the FINAL status is what catches it.
                CODE="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 90 -r 0-0 "$BASE/$ENC")"
                case "$CODE" in
                  200|206) echo "  OK   $ART -> HTTP $CODE" ;;
                  *)       echo "  FAIL $ART -> HTTP $CODE"; FAILED=1 ;;
                esac
              done < <(printf '%s\n' "$ARTIFACTS")

              if [ "$FAILED" -ne 0 ]; then
                echo "::error::The manifest advertises artifact(s) that are not downloadable. A filename containing capitals gets lowercased by the origin and will 404 — keep artifactName lowercase, and upload every name the manifest references."
                exit 1
              fi
              echo "All advertised release artifacts are downloadable."

              # Integrity: hash the bytes the CDN actually serves and compare against the
              # manifest. An HTTP 200/206 only proves something is there — it happily
              # returns a STALE cached object of the right size, which electron-updater
              # then rejects on the sha512 check. That failure surfaces to the user as a
              # broken update, while CI stays green. Observed after republishing a version.
              ZIP="$(printf '%s\n' "$BODY" | awk -F'url: ' '/url: .*\.zip$/{print $2; exit}' | tr -d '\r')"
              EXPECT_HASH="$(printf '%s\n' "$BODY" | awk '/sha512:/{print $2; exit}' | tr -d '\r')"
              if [ -n "$ZIP" ] && [ -n "$EXPECT_HASH" ]; then
                ENC="$(printf '%s' "$ZIP" | sed 's/ /%20/g')"
                echo "Verifying sha512 of the served zip (~110MB) ..."
                ACTUAL_HASH="$(curl -fsSL --max-time 300 "$BASE/$ENC" \
                  | openssl dgst -sha512 -binary | base64 | tr -d '\n')"
                if [ "$ACTUAL_HASH" = "$EXPECT_HASH" ]; then
                  echo "Integrity OK — the served zip matches the manifest hash."
                else
                  echo "::error::Served zip does not match the manifest sha512. The CDN is almost certainly serving a stale cached object for this filename (re-publishing the same version does that). Bump the version or purge the edge cache for this URL."
                  echo "  manifest: $EXPECT_HASH"
                  echo "  served  : $ACTUAL_HASH"
                  exit 1
                fi
              else
                echo "::warning::Could not parse a zip url + sha512 pair for the integrity check."
              fi
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "::error::Published manifest still reports '${PUBLISHED:-<none>}' instead of '$VERSION' after 6 attempts."
          exit 1

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: claude-tray-notifier-${{ needs.check-version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
